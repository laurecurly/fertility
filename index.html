<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projet BB — Protocole Vitanova</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #22c55e;
    --green-soft: #dcfce7;
    --ink: #000000;
    --paper: #ffffff;
    --muted: #555555;
    --border: 2px solid #000;
    font-family: 'IBM Plex Sans', 'Space Grotesk', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  body { margin: 0; background: var(--paper); }
  main { max-width: 940px; margin: 0 auto; padding: 32px 20px 64px; }

  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.6rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -.02em; text-transform: uppercase; }
  .subtitle { color: var(--muted); margin: 0 0 4px; font-size: .9rem; font-weight: 500; }
  .badge { display: inline-block; font-family: 'Space Grotesk', sans-serif; font-size: .72rem; font-weight: 700; padding: 3px 12px; border: var(--border); margin-left: 10px; vertical-align: middle; text-transform: uppercase; letter-spacing: .04em; background: var(--green-soft); }
  .live { font-family: 'Space Grotesk', sans-serif; font-size: .72rem; font-weight: 700; margin-left: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .live.ok { color: #15803d; }
  .live.ko { color: #b45309; }
  .rule { height: 4px; background: var(--green); margin: 18px 0 26px; }

  /* ── Frise temporelle ── */
  .frise-card { border: var(--border); background: var(--paper); padding: 24px 20px 14px; margin: 0 0 22px; }
  .frise { position: relative; height: 88px; }
  .frise .track { position: absolute; left: 0; right: 0; top: 38px; height: 8px; background: #000; }
  .frise .fill { position: absolute; left: 0; top: 38px; height: 8px; background: var(--green); }
  .frise .today-line { position: absolute; top: 24px; width: 3px; height: 36px; background: #000; }
  .frise .today-label { position: absolute; top: -2px; transform: translateX(-50%); font-family: 'Space Grotesk', sans-serif; font-size: .66rem; font-weight: 700; color: #fff;
    background: #000; padding: 2px 8px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .ms { position: absolute; top: 0; transform: translateX(-50%); text-align: center; width: 90px; }
  .ms .dot { width: 14px; height: 14px; margin: 31px auto 7px; background: var(--paper); border: 2px solid #000; box-sizing: border-box; }
  .ms.done .dot { background: var(--green); }
  .ms.test .dot { border-color: #000; background: var(--ink); }
  .ms .lbl { font-family: 'Space Grotesk', sans-serif; font-size: .68rem; font-weight: 700; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em; }
  .ms .day { font-size: .64rem; font-weight: 600; color: var(--green); font-family: 'Space Grotesk', sans-serif; }
  .ms .day.done { color: #15803d; }

  /* ── Prochaine étape (carte pleine largeur) ── */
  .hero { border: var(--border); background: var(--ink); color: #fff; padding: 20px 22px; margin-bottom: 16px; }
  .hero .label { font-family: 'Space Grotesk', sans-serif; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--green); }
  .hero .value { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
  .hero .date { font-size: .88rem; font-weight: 500; margin-top: 4px; color: #d4d4d4; }

  /* ── Grille de cartes ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .card { border: var(--border); background: var(--paper); padding: 16px 18px; }
  .card .num { font-family: 'Space Grotesk', sans-serif; font-size: .8rem; font-weight: 700; color: var(--green); }
  .card .label { font-family: 'Space Grotesk', sans-serif; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: 6px; }
  .card .value { font-size: 1rem; font-weight: 700; margin-top: 6px; }
  .card .date { font-size: .78rem; font-weight: 600; margin-top: 3px; color: var(--muted); }

  /* ── Sections ── */
  h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; margin: 34px 0 4px; text-transform: uppercase; letter-spacing: .01em; }
  .h2-rule { height: 3px; background: var(--green); width: 64px; margin: 0 0 16px; }

  ul.timeline { list-style: none; padding: 0; margin: 0; }
  li { border: var(--border); background: var(--paper); padding: 13px 16px 13px 18px; margin-bottom: 10px; position: relative; }
  li.today { background: var(--green-soft); }
  li.done { opacity: .55; }
  li .when { font-family: 'Space Grotesk', sans-serif; font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  li .num { font-family: 'Space Grotesk', sans-serif; color: var(--green); font-weight: 700; margin-right: 6px; }
  li .what { font-weight: 700; display: inline; }
  li .detail { font-size: .84rem; font-weight: 400; color: var(--muted); margin-top: 3px; }
  .status { font-family: 'Space Grotesk', sans-serif; font-size: .66rem; font-weight: 700; padding: 2px 8px; border: 1.5px solid #000; margin-left: 8px; vertical-align: middle; text-transform: uppercase; letter-spacing: .03em; }
  .status.à-venir { background: var(--paper); }
  .status.à-faire { background: #fef9c3; }
  .status.fait { background: var(--green); color: #fff; border-color: #000; }
  .seg { display: inline-flex; gap: 0; margin-left: 10px; vertical-align: middle; }
  .seg button { font-family: 'Space Grotesk', sans-serif; font-size: .64rem; padding: 3px 9px;
    border: 1.5px solid #000; background: #fff; color: #000; cursor: pointer;
    text-transform: uppercase; letter-spacing: .03em; font-weight: 500;
    touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
  .seg button + button { border-left: none; }
  .seg button:first-child { border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button:hover { background: #eee; }
  .seg button.active { background: var(--green); color: #fff; font-weight: 700; }
  .sync-warn { font-size: .7rem; font-weight: 600; color: #b45309; margin-top: 4px; display: none; }
  footer { font-size: .74rem; font-weight: 500; color: var(--muted); margin-top: 40px; border-top: 2px solid #000; padding-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Projet BB <span class="badge">Cycle naturel — Vitanova</span></h1>
  <p class="subtitle"><span id="subtitle">Protocole FET en cycle naturel</span><span class="live" id="live-indicator"></span></p>
  <div class="rule"></div>

  <div class="frise-card">
    <div class="frise" id="frise">
      <div class="track"></div>
      <div class="fill" id="frise-fill"></div>
    </div>
  </div>

  <div class="hero" id="next-card">
    <div class="label">Prochaine étape</div>
    <div class="value" id="next-title">—</div>
    <div class="date" id="next-date">—</div>
    <div class="sync-warn" id="sync-warn">⚠ Modifications en attente de synchronisation — elles seront envoyées au prochain chargement de la page.</div>
  </div>

  <div class="grid" id="cards"></div>

  <h2>Calendrier du cycle</h2>
  <div class="h2-rule"></div>
  <ul class="timeline" id="cycle"></ul>

  <h2>Avant le cycle</h2>
  <div class="h2-rule"></div>
  <ul class="timeline" id="pre"></ul>

  <footer id="footer"></footer>
</main>

<script>
  // ── Source des données ──────────────────────────────────
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtuTGAxUF1LrASHyVpL1JkgClU4JGz5PwLRcCgwDQVmNpY8EN1QlMjTXeX1lA5NAlhgDQ1KRHSKT19/pub?gid=1190738777&single=true&output=csv";
  // URL de l'application web Apps Script (donnée à l'étape 2 des instructions) :
  const APPS_SCRIPT_URL = `https://script.google.com/macros/s/AKfycbzdCD2MluGhP3W_3Di4Natkd7Kwjjqrdp8DIovfuW-fmDVhQg97vI2pKX1lrxW16oQsWw/exec`.replace(/\s+/g, "");

  // ── Données de secours (dernier état du sheet au 03/10/2026) ──
  const FALLBACK = {
    j1: "2026-11-01",
    cycle: [
      { title: "Début des règles (J1)", day: 1, detail: "Email à support@vitanova.dk — réponse avec les dates exactes sous 24 h", status: "À venir" },
      { title: "Échographie (J10)", day: 10, detail: "Follicules et endomètre. Si faite en France, envoyer le compte rendu avant 14 h", status: "À venir" },
      { title: "Ovitrelle 250 µg à 22 h (J12)", day: 12, detail: "Si endomètre > 7 mm et follicule ≥ 17 mm. Date confirmée par Vitanova", status: "À venir" },
      { title: "Transfert du blastocyste (J19)", day: 19, detail: "Consentement de décongélation signé avant. Vessie à moitié pleine", status: "À venir" },
      { title: "Test urinaire (J33)", day: 33, detail: "Résultat à communiquer à la clinique", status: "À venir" },
      { title: "Prise de sang hCG (si test positif)", day: 33, detail: "Le jour du test ou le lendemain", status: "À venir" },
      { title: "Échographie précoce (si test positif)", day: 54, detail: "Environ 3 semaines après le test positif", status: "À venir" },
    ],
    pre: [
      { title: "Treatment Call — ouverture de fenêtre", date: "2026-10-11", detail: "Appel avec une sage-femme ou une infirmière", status: "À faire" },
      { title: "Treatment Call — fin de fenêtre", date: "2026-10-18", detail: "Appel avec une sage-femme ou une infirmière", status: "À faire" },
      { title: "Acheter Ovitrelle et Utrogestan", date: "2026-11-01", detail: "Vérifier l'ordonnance danoise avec la pharmacie", status: "À faire" },
      { title: "Signer les 2 consentements de traitement", date: null, detail: "Dès que possible — date de naissance à la place du CPR", status: "À faire" },
    ],
  };

  // ── Parsing du CSV publié ───────────────────────────────
  function parseCsv(text) {
    const rows = []; let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ""));
  }

  function toIso(v) {
    if (!v) return null;
    const m = v.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    const m2 = v.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m2) return m2[0];
    return null;
  }

  function parseSheet(rows) {
    const data = { j1: null, cycle: [], pre: [] };
    let section = null;
    for (const r of rows) {
      const c = (i) => (r[i] || "").trim();
      if (c(0).startsWith("Date de J1")) { data.j1 = toIso(c(1)); continue; }
      if (c(0) === "Calendrier du cycle") { section = "cycle"; continue; }
      if (c(0) === "Avant le cycle") { section = "pre"; continue; }
      if (!c(0) || c(0).startsWith("Entrées") || c(0).startsWith("Protocole")) continue;
      if (section === "cycle") {
        const day = /^\d+$/.test(c(1)) ? parseInt(c(1), 10) : null;
        data.cycle.push({ title: c(0), day, date: toIso(c(2)), detail: c(3), status: c(4) || "À venir" });
      } else if (section === "pre") {
        data.pre.push({ title: c(0), date: toIso(c(1)), rawWhen: c(1) && !toIso(c(1)) ? c(1) : null, detail: c(3), status: c(4) || "À faire" });
      }
    }
    return data;
  }

  // ── Rendu ───────────────────────────────────────────────
  const fmt = new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
  const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d; };
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const dayDiff = (a, b) => Math.round((a - b) / 86400000);

  // Globals pour l'interactivité
  let DATA = null, ITEMS = [], LIVE = false;

  // ── Envoi des statuts vers le Google Sheet ──────────────
  const PENDING_KEY = "projetbb-pending";

  function getPending() {
    try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch { return []; }
  }
  function savePending(p) {
    const list = getPending().filter(x => x.title !== p.title);
    list.push(p);
    localStorage.setItem(PENDING_KEY, JSON.stringify(list));
    updateSyncWarn();
  }
  function clearPending(p) {
    localStorage.setItem(PENDING_KEY, JSON.stringify(getPending().filter(x => x.title !== p.title)));
    updateSyncWarn();
  }
  function updateSyncWarn() {
    const el = document.getElementById("sync-warn");
    if (el) el.style.display = getPending().length ? "block" : "none";
  }

  function sendToSheet(p) {
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(p),
    });
  }

  function setStatus(item, newStatus) {
    if (item.status === newStatus) return;
    item.status = newStatus;
    render(DATA, LIVE); // re-rendu immédiat : le bouton du nouveau statut passe en vert
    const payload = { title: item.title, status: newStatus };
    if (APPS_SCRIPT_URL) {
      savePending(payload);
      sendToSheet(payload)
        .then(() => clearPending(payload))
        .catch(() => { /* reste en file d'attente, sera retenté */ });
    } else {
      savePending(payload); // sans script : garde-fou local
    }
  }

  const STATUSES = ["À venir", "À faire", "Fait"];

  // Écouteur global robuste : réagit au premier appui (souris ou tactile)
  let lastHandled = 0;
  function handleSeg(ev) {
    const btn = ev.target.closest ? ev.target.closest(".seg button") : null;
    if (!btn) return;
    if (Date.now() - lastHandled < 500) return; // évite le déclenchement double
    lastHandled = Date.now();
    const item = ITEMS[parseInt(btn.dataset.idx, 10)];
    if (item) setStatus(item, STATUSES[parseInt(btn.dataset.s, 10)]);
  }
  document.addEventListener("pointerdown", handleSeg, { passive: true });
  document.addEventListener("click", handleSeg, { passive: true });

  async function flushPending() {
    if (!APPS_SCRIPT_URL) return;
    for (const p of getPending()) {
      try { await sendToSheet(p); clearPending(p); } catch { break; }
    }
  }

  function normalize(data) {
    const items = [
      ...data.cycle.map(e => ({
        ...e,
        iso: e.date || (e.day && data.j1 ? addDays(data.j1, e.day - 1).toISOString().slice(0, 10) : null),
        group: "cycle",
      })),
      ...data.pre.map(e => ({ ...e, iso: e.date || null, group: "pre" })),
    ];
    items.forEach((e, idx) => { e.moment = e.iso ? new Date(e.iso + "T12:00:00") : null; e.idx = idx; });
    items.sort((a, b) => (a.iso || "9999").localeCompare(b.iso || "9999"));
    return items;
  }

  function render(data, live) {
    DATA = data; LIVE = live;
    document.getElementById("live-indicator").textContent = live ? "· données en direct (Google Sheet)" : "· données figées du 03/10/2026";
    document.getElementById("live-indicator").className = "live " + (live ? "ok" : "ko");

    document.getElementById("subtitle").textContent =
      "J1 : " + (data.j1 ? fmt.format(new Date(data.j1 + "T12:00:00")) : "—") + " · Aujourd'hui : " + fmt.format(today);

    const items = normalize(data);
    ITEMS = items;

    // ── Frise temporelle ──
    renderFrise(data, items);

    // Cartes clés (numérotées 01–06 comme dans la maquette)
    const keys = [
      { match: /règles/i, label: "Début des règles" },
      { match: /échographie$/i, label: "Échographie" },
      { match: /ovitrelle/i, label: "Ovitrelle" },
      { match: /transfert/i, label: "Transfert" },
      { match: /test urinaire/i, label: "Test urinaire" },
      { match: /précoce/i, label: "Écho précoce" },
    ];
    let cardNum = 0;
    const cards = keys.map(k => {
      const e = items.find(i => i.group === "cycle" && k.match.test(i.title));
      cardNum++;
      return e && e.moment ? { num: String(cardNum).padStart(2, "0"), label: k.label, moment: e.moment, day: e.day } : null;
    }).filter(Boolean);
    document.getElementById("cards").innerHTML = cards.map(c => {
      const n = dayDiff(c.moment, today);
      return `<div class="card"><div class="num">${c.num}${c.day ? " — J" + c.day : ""}</div>
        <div class="label">${c.label}</div>
        <div class="value">${fmt.format(c.moment)}</div>
        <div class="date">${n === 0 ? "aujourd'hui" : n > 0 ? "dans " + n + " j" : "il y a " + (-n) + " j"}</div></div>`;
    }).join("");

    // Prochaine étape
    const next = items.find(e => e.moment && e.moment >= today && e.status !== "Fait");
    if (next) {
      document.getElementById("next-title").textContent = next.title;
      document.getElementById("next-date").textContent = fmt.format(next.moment) +
        " — dans " + dayDiff(next.moment, today) + " jours";
    } else {
      document.getElementById("next-title").textContent = "Aucune étape à venir";
      document.getElementById("next-date").textContent = "";
    }

    // Timelines
    const statusBadge = (s) => {
      const cls = s === "Fait" ? "fait" : s === "À faire" ? "à-faire" : "à-venir";
      return `<span class="status ${cls}">${s}</span>`;
    };
    let cycNum = 0, preNum = 0;
    const segControl = (e) => `<span class="seg">` + STATUSES.map((s, i) =>
      `<button type="button" data-idx="${e.idx}" data-s="${i}" class="${e.status === s ? "active" : ""}">${s}</button>`
    ).join("") + `</span>`;
    const li = (e) => {
      const isDone = e.status === "Fait";
      const cls = isDone ? "done" : !e.moment ? "" : dayDiff(e.moment, today) === 0 ? "today" : "";
      const num = e.group === "cycle" ? String(++cycNum).padStart(2, "0") : String(++preNum).padStart(2, "0");
      const when = e.group === "cycle"
        ? (e.day ? "J" + e.day + " · " : "") + (e.moment ? fmt.format(e.moment) : "À confirmer")
        : (e.moment ? fmt.format(e.moment) : e.rawWhen || "Dès que possible");
      return `<li class="${cls}"><div class="when"><span class="num">${num}</span>${when}</div>
        <div class="what">${e.title}</div>${segControl(e)}
        ${e.detail ? `<div class="detail">${e.detail}</div>` : ""}</li>`;
    };
    document.getElementById("cycle").innerHTML = items.filter(e => e.group === "cycle").map(li).join("");
    document.getElementById("pre").innerHTML = items.filter(e => e.group === "pre").map(li).join("");
    document.getElementById("footer").textContent =
      live ? "Source : Google Sheet « Protocole FET » (publié en CSV) — rechargé à chaque visite."
           : "Source : Google Sheet « Protocole FET » — données du 03/10/2026.";
  }

  // ── Frise temporelle ──
  function renderFrise(data, items) {
    const frise = document.getElementById("frise");
    const fill = document.getElementById("frise-fill");
    if (!data.j1) { frise.parentElement.style.display = "none"; return; }

    const j1 = new Date(data.j1 + "T12:00:00");
    const D_MAX = 56;
    const pct = (d) => Math.min(100, Math.max(0, ((d - 1) / (D_MAX - 1)) * 100));

    const milestones = [
      { match: /règles/i, lbl: "Règles", cls: "" },
      { match: /échographie$/i, lbl: "Écho", cls: "" },
      { match: /ovitrelle/i, lbl: "Ovitrelle", cls: "" },
      { match: /transfert/i, lbl: "Transfert", cls: "test" },
      { match: /test urinaire/i, lbl: "Test", cls: "test" },
      { match: /précoce/i, lbl: "Écho précoce", cls: "" },
    ].map(m => {
      const e = items.find(i => i.group === "cycle" && m.match.test(i.title));
      if (!e || !e.day) return null;
      return { ...m, day: e.day, done: e.status === "Fait", past: e.moment && e.moment < today };
    }).filter(Boolean);

    let html = "";
    for (const ms of milestones) {
      const p = pct(ms.day);
      html += `<div class="ms ${ms.cls} ${ms.done ? "done" : ""}" style="left:${p}%">
        <div class="dot"></div><div class="lbl">${ms.lbl}</div><div class="day ${ms.done ? "done" : ""}">J${ms.day}</div></div>`;
    }
    const todayDay = dayDiff(today, j1) + 1;
    if (todayDay >= 1 && todayDay <= D_MAX) {
      const p = pct(todayDay);
      html += `<div class="today-line" style="left:${p}%"></div>
        <div class="today-label" style="left:${p}%">Aujourd'hui · J${todayDay}</div>`;
      fill.style.width = p + "%";
    } else if (todayDay < 1) {
      fill.style.width = "0%";
    } else {
      fill.style.width = "100%";
    }
    frise.insertAdjacentHTML("beforeend", html);
  }

  // ── Chargement : CSV live si dispo, sinon secours ────────
  async function main() {
    if (SHEET_CSV_URL && location.protocol.startsWith("http")) {
      try {
        const res = await fetch(SHEET_CSV_URL + "&_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const data = parseSheet(parseCsv(await res.text()));
        if (data.j1 && data.cycle.length) { flushPending(); return render(data, true); }
        throw new Error("sheet incomplet");
      } catch (e) {
        console.warn("Lecture du sheet impossible, données figées :", e);
      }
    }
    render(FALLBACK, false);
  }
  main();
</script>
</body>
</html>
